<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Link in Bio</title>
  <style>
    :root{
      --bg: #05060a;
      --panel-bg: rgba(255,255,255,0.02);
      --muted: rgba(255,255,255,0.72);
      --text: #f6f6f7;
      --accent: #C9A95B;
      --radius-lg: 24px;
      --ease-standard: cubic-bezier(.22,.9,.3,1);
      --ease-slow: cubic-bezier(.16,.85,.28,1);
      --short: 280ms;
      --medium: 560ms;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;position:relative}

    /* Background video and dimmer */
    #bgVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-6}
    body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,0.28),rgba(0,0,0,0.36));z-index:-5;pointer-events:none}

    /* Canvases */
    /* stormCanvas unused for now but reserved */
    #stormCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;display:block;z-index:-4}
    /* bubbles should appear above the UI visually but should not block pointer events to the UI */
    #bubbleCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;display:block;z-index:60}

    /* Splash overlay */
    #splashScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1050;background:rgba(0,0,0,0.65);cursor:pointer;transition:opacity .5s var(--ease-standard)}
    #splashScreen .overlay-text{color:#fff;font-family:'Courier New',monospace;font-size:18px;letter-spacing:.14em;padding:14px 22px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01))}
    #splashScreen.overlay-hidden{opacity:0;pointer-events:none}

    /* Glass panel (UI) */
    .glass-container{position:relative;z-index:10;background:linear-gradient(180deg,var(--panel-bg),rgba(255,255,255,0.01));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:var(--radius-lg);padding:28px;width:min(760px,92vw);box-shadow:0 6px 30px rgba(0,0,0,0.6);transition:box-shadow var(--medium) var(--ease-standard),transform var(--medium) var(--ease-standard)}
    .glass-container::after{content:'';position:absolute;inset:-8px;border-radius:var(--radius-lg);pointer-events:none;box-shadow:0 0 60px 10px rgba(201,169,91,0.06);filter:blur(6px);opacity:1;transition:opacity var(--medium) var(--ease-standard)}

    .profile-row{display:flex;align-items:center;gap:14px;justify-content:center}
    .profile-image{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0;border:2px solid rgba(255,255,255,0.06);transform-origin:center;backface-visibility:hidden;will-change:transform}

    .name{color:var(--text);font-size:26px;letter-spacing:0.12em;text-transform:uppercase;margin:0;opacity:0;position:relative;padding-left:44px}
    .bio{color:var(--muted);margin:6px 0 16px;opacity:0;transform:translateY(6px)}

    .fall { opacity:0; transform: translateY(-18px) scale(0.998); will-change:transform,opacity; }
    .fall.in { opacity:1; transform:none; transition: transform var(--medium) var(--ease-standard), opacity calc(var(--medium) - 120ms) ease; }

    .links-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;opacity:0;transform:translateY(6px) scale(0.999);transition:opacity var(--short) var(--ease-standard),transform var(--short) var(--ease-standard)}
    .site-started .links-grid{opacity:1;transform:none}
    .link-btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));color:var(--muted);font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,0.45);transition: transform 320ms var(--ease-standard), box-shadow 320ms var(--ease-standard), background-color 320ms var(--ease-standard)}
    .link-btn:hover{ transform: translateY(-3px); box-shadow:0 18px 48px rgba(0,0,0,0.5); color:var(--text); background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)); }

    @media(max-width:420px){.links-grid{grid-template-columns:repeat(3,1fr)} }
    @media(max-width:320px){.links-grid{grid-template-columns:repeat(2,1fr);gap:8px}}

    /* per-character CSS reveal */
    @keyframes charReveal { from { opacity:0; transform: translateY(8px) scale(1.01); filter: blur(1px); } to { opacity:1; transform: translateY(0) scale(1); filter: blur(0); } }
    .char-pop{ display:inline-block; opacity:0; transform:translateY(8px); will-change:transform,opacity; }
    .char-pop.revealed{ animation: charReveal 460ms var(--ease-slow) both; }

    .bio.in { opacity:1; transform:none; transition: opacity 420ms var(--ease-slow), transform 420ms var(--ease-slow); }

    /* prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce){ * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } #bubbleCanvas, #stormCanvas { display:none !important; } }
  </style>
</head>
<body>
  <video id="bgVideo" playsinline webkit-playsinline loop preload="auto" muted>
    <source src="Cowboy.mp4" type="video/mp4">
  </video>

  <canvas id="stormCanvas" aria-hidden="true"></canvas>
  <canvas id="bubbleCanvas" aria-hidden="true"></canvas>

  <div id="splashScreen"><div class="overlay-text">Click to enter...</div></div>

  <div class="glass-container fall" id="glassContainer">
    <div class="profile-row">
      <img src="pfp.jpg" alt="Profile" class="profile-image" id="pfp">
      <div style="position:relative;">
        <h1 class="name" id="nameEl"></h1>
        <p class="bio" id="bioEl"></p>
      </div>
    </div>

    <div class="links-grid" id="linksGrid">
      <a class="link-btn magnetic" href="#">Affly Intel</a>
      <a class="link-btn magnetic" href="#">$AFFLY</a>
      <a class="link-btn magnetic" href="#">Affly Forge</a>
      <a class="link-btn magnetic" href="#">Affly Systems</a>
      <a class="link-btn magnetic" href="#">Affly Games</a>
      <a class="link-btn magnetic" href="#">Affly Media</a>
      <a class="link-btn magnetic" href="#">Affly Network</a>
      <a class="link-btn magnetic" href="#">Affly Socials</a>
    </div>
  </div>

  <script>
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) || window.matchMedia('(pointer:coarse)').matches;
    const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const rand = (min,max) => Math.random()*(max-min)+min;
    const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

    // Audio context helper
    let audioCtx = null;
    async function ensureAudioContextAndResume(){
      try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') await audioCtx.resume(); }catch(e){}
    }

    // small pop sound via WebAudio (no external file needed)
    function playPopSound(){
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.6, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        const bi = audioCtx.createBiquadFilter(); bi.type = 'highpass'; bi.frequency.value = 800;

        const o = audioCtx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(rand(800,1200), now);
        o.connect(bi);
        bi.connect(g);
        g.connect(audioCtx.destination);
        o.start(now);
        o.stop(now + 0.16);

        // small noise burst
        const bufferSize = 0.1 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * Math.exp(-i / (bufferSize*0.08));
        const noise = audioCtx.createBufferSource(); noise.buffer = buffer; const ng = audioCtx.createGain(); ng.gain.setValueAtTime(0.5, now); ng.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        noise.connect(ng); ng.connect(bi);
        noise.start(now);
        noise.stop(now + 0.12);

        // cleanup
        setTimeout(()=>{ try{ o.disconnect(); noise.disconnect(); g.disconnect(); bi.disconnect(); }catch(e){} }, 500);
      }catch(e){ console.warn('pop sound failed', e); }
    }

    // state
    let uiRevealed = false;
    let animationsStarted = false;
    let bubbleRAF = null;
    let playAttempted = false;

    // bubble system
    const bubbleCanvas = document.getElementById('bubbleCanvas');
    const bCtx = bubbleCanvas.getContext('2d');
    let bW = 0, bH = 0, bDPR = 1;
    const bubbles = [];
    const particles = [];
    const MAX_BUBBLES = isTouch ? 40 : 220; // noticeable
    const cornerThreshold = 88; // distance to corner to trigger pop

    function resizeBubbleCanvas(){
      bDPR = isTouch ? 1 : Math.min(window.devicePixelRatio || 1, 2);
      bW = window.innerWidth; bH = window.innerHeight;
      bubbleCanvas.width = Math.floor(bW * bDPR); bubbleCanvas.height = Math.floor(bH * bDPR);
      bubbleCanvas.style.width = bW+'px'; bubbleCanvas.style.height = bH+'px'; bCtx.setTransform(bDPR,0,0,bDPR,0,0);
    }

    function createBubble(){
      if(bubbles.length >= MAX_BUBBLES) return;
      const r = rand(isTouch?8:14, isTouch?28:44);
      const x = rand(r, bW - r);
      const y = bH + r + rand(0, 40);
      const vy = -rand(isTouch?22:40, isTouch?48:140);
      const wobble = rand(0.8,2.2);
      const hue = 200 + Math.random()*30;
      const alpha = clamp(0.16 + (44 - r)/200, 0.04, 0.36);
      bubbles.push({x,y,baseX:x,r,vy,vx:rand(-8,8),age:0,hue,alpha,wobble});
    }

    function popBubbleAtIndex(i, byClick=false){
      const b = bubbles[i]; if(!b) return;
      // spawn particles
      const count = Math.round(clamp(b.r/6, 6, 20));
      for(let k=0;k<count;k++){
        const angle = rand(0,Math.PI*2);
        const speed = rand(40,260);
        particles.push({x:b.x, y:b.y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, age:0, life:0.6 + Math.random()*0.3, r:Math.max(1, b.r*0.12)});
      }
      // pop sound
      try{ ensureAudioContextAndResume().then(()=>playPopSound()); }catch(e){}
      bubbles.splice(i,1);
    }

    function updateBubbles(dt){
      // ensure a steady stream up to MAX_BUBBLES
      while(bubbles.length < MAX_BUBBLES) createBubble();
      for(let i=bubbles.length-1;i>=0;i--){
        const p = bubbles[i]; p.age += dt; p.x = p.baseX + Math.sin(p.age * p.wobble) * (p.r * 0.12) + p.vx * p.age * 0.002; p.y += p.vy * dt;
        // pop when touching top edge
        if(p.y + p.r < -20){ popBubbleAtIndex(i); continue; }
        // pop when close to top-left or top-right corner
        const dTL = Math.hypot(p.x - 0, p.y - 0);
        const dTR = Math.hypot(p.x - bW, p.y - 0);
        if(dTL <= cornerThreshold || dTR <= cornerThreshold){ popBubbleAtIndex(i); continue; }
      }
      for(let j=particles.length-1;j>=0;j--){ const sp = particles[j]; sp.vy += 800 * dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.age += dt; sp.r *= 0.98; if(sp.age >= sp.life) particles.splice(j,1); }
    }

    function drawBubbles(){
      bCtx.clearRect(0,0,bW,bH);
      bCtx.globalCompositeOperation = 'lighter';
      for(const p of bubbles){
        bCtx.save(); const r = p.r; // soft pearl gradient
        const grd = bCtx.createRadialGradient(p.x - r*0.22, p.y - r*0.28, r*0.06, p.x, p.y, r);
        grd.addColorStop(0, `rgba(255,255,255,${Math.min(0.95, p.alpha*1.6)})`);
        grd.addColorStop(0.45, `rgba(240,245,255,${Math.min(0.6, p.alpha*1.1)})`);
        grd.addColorStop(1, `rgba(255,255,255,0)`);
        bCtx.fillStyle = grd;
        bCtx.beginPath(); bCtx.arc(p.x, p.y, r, 0, Math.PI*2); bCtx.fill();
        bCtx.lineWidth = Math.max(0.6, r*0.02);
        bCtx.strokeStyle = `rgba(255,255,255,${Math.min(0.22, p.alpha*0.9)})`;
        bCtx.stroke();
        bCtx.restore();
      }
      bCtx.globalCompositeOperation = 'source-over';
      for(const sp of particles){ bCtx.save(); bCtx.fillStyle = 'rgba(255,255,255,0.95)'; bCtx.beginPath(); bCtx.arc(sp.x, sp.y, sp.r, 0, Math.PI*2); bCtx.fill(); bCtx.restore(); }
    }

    function startBubbleLoop(){ if(bubbleRAF) return; function loop(now){ bubbleRAF = requestAnimationFrame(loop); const dt = Math.min(0.045, (now - (startBubbleLoop.last||now))/1000); updateBubbles(dt); drawBubbles(); startBubbleLoop.last = now; } bubbleRAF = requestAnimationFrame(loop); }
    function stopBubbleLoop(){ if(bubbleRAF){ cancelAnimationFrame(bubbleRAF); bubbleRAF = null; startBubbleLoop.last = null; } }

    // pointer interaction (pop on click)
    function handleGlobalPointerDown(e){ const x = e.touches ? e.touches[0].clientX : e.clientX; const y = e.touches ? e.touches[0].clientY : e.clientY; // check bubble hits
      for(let i=bubbles.length-1;i>=0;i--){ const b = bubbles[i]; const dx = x - b.x; const dy = y - b.y; if(dx*dx + dy*dy <= b.r*b.r){ popBubbleAtIndex(i, true); return; } }
    }

    // page animations
    const nameText = 'AFFLY';
    const bioText = 'Trying to survive another boring day.....';

    function animateAvatarToss(){ const img = document.getElementById('pfp'); const up = -140 - Math.min(window.innerHeight*0.06, 80); const keyframes = [ { transform: 'translateY(0px) rotateZ(0deg) scale(1)', offset:0 }, { transform: `translateY(${up}px) rotateZ(16deg) scale(1.02)`, offset:0.48, easing:'cubic-bezier(.2,.8,.26,1)' }, { transform: `translateY(10px) rotateZ(-6deg) scale(0.995)`, offset:0.82, easing:'cubic-bezier(.22,.9,.3,1)' }, { transform: 'translateY(0px) rotateZ(0deg) scale(1)', offset:1, easing:'cubic-bezier(.22,.9,.3,1)' } ]; const anim = img.animate(keyframes, { duration: 1500, iterations:1, fill:'forwards' }); return anim.finished.catch(()=>{}); }

    function spiderCrawlAndReveal(nameEl, text, duration=1200){ return new Promise((resolve)=>{ nameEl.innerHTML = ''; const chars = []; for(const ch of text){ const s = document.createElement('span'); s.className = 'char-pop'; s.textContent = ch; s.style.opacity = 0; s.style.display = 'inline-block'; s.style.transform = 'translateY(8px)'; nameEl.appendChild(s); chars.push(s); } const spiderWrap = document.createElement('div'); spiderWrap.className = 'spider'; spiderWrap.style.position = 'absolute'; spiderWrap.style.left = '-48px'; spiderWrap.style.top = '-6px'; spiderWrap.style.pointerEvents = 'none'; spiderWrap.innerHTML = `<svg class="spider-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="2.4" fill="white"></circle><path d="M12 12.8 v3 M8 11 l-3 2 M16 11 l3 2 M9 8 l-2 -3 M15 8 l2 -3"/></g></svg>`; const parent = nameEl.parentElement; parent.style.position = parent.style.position || 'relative'; parent.appendChild(spiderWrap); requestAnimationFrame(()=>{ const parentRect = parent.getBoundingClientRect(); const nameRect = nameEl.getBoundingClientRect(); const charRects = chars.map(c=>c.getBoundingClientRect()); const startX = nameRect.left - parentRect.left - 48; const endX = nameRect.right - parentRect.left + 12; const total = duration; const startTime = performance.now(); function step(now){ const t = Math.min(1, (now - startTime)/total); const ease = t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; const x = startX + (endX - startX) * ease; spiderWrap.style.transform = `translateX(${x}px)`; const spiderCenter = parentRect.left + x + 12; for(let i=0;i<charRects.length;i++){ const cr = charRects[i]; const charCenter = cr.left + cr.width/2; if(charCenter <= spiderCenter && !chars[i].classList.contains('revealed')){ const delayMs = Math.min(360, Math.abs(spiderCenter - charCenter) * 0.06) + i * 18; chars[i].style.animationDelay = `${delayMs}ms`; chars[i].classList.add('revealed'); } } if(t < 1 && !prefersReducedMotion){ requestAnimationFrame(step); } else { for(const s of chars){ s.classList.add('revealed'); } spiderWrap.classList.add('spider-logo'); spiderWrap.style.left = '0px'; spiderWrap.style.top = '0px'; spiderWrap.style.transform = 'translateX(-8px) scale(0.92)'; setTimeout(()=>{ resolve(); }, 320); } } requestAnimationFrame(step); }); }); }

    function revealBio(el, text){ el.textContent = text; el.classList.add('in'); }

    async function startSiteAnimations(){ if(animationsStarted) return; animationsStarted = true; try{ const avatarPromise = animateAvatarToss(); const nameEl = document.getElementById('nameEl'); await spiderCrawlAndReveal(nameEl, nameText, 1200); revealBio(document.getElementById('bioEl'), bioText); document.body.classList.add('site-started'); await avatarPromise; }catch(err){ console.error('startSiteAnimations error:', err); revealUI(); } }

    function revealUI(){ if(uiRevealed) return; uiRevealed = true; document.body.classList.add('site-started'); const toShow = document.querySelectorAll('.fall, .name, .bio, .links-grid, .profile-row'); toShow.forEach(el=>{ el.classList.remove('fall'); el.classList.add('in'); el.style.opacity = 1; el.style.transform = 'none'; }); }

    // click flow
    const splash = document.getElementById('splashScreen'); const video = document.getElementById('bgVideo');
    async function onSplashClick(ev){ ev.preventDefault(); ev.stopPropagation(); revealUI(); if(!prefersReducedMotion) startBubbleLoop(); try{ await ensureAudioContextAndResume(); }catch(e){}
      if(video && !playAttempted){ playAttempted = true; video.muted = false; video.volume = 1.0; try{ await video.play(); console.log('[media] video.play() succeeded'); }catch(err){ console.warn('[media] video.play() rejected — will use fallback audio', err); playFallbackAudio(); } }
      splash.classList.add('overlay-hidden'); setTimeout(()=>{ splash.style.display='none'; }, 520);
      try{ startSiteAnimations(); }catch(err){ console.error(err); }
    }
    splash.addEventListener('click', onSplashClick, {passive:false, once:true});

    // pointer handling - global (so canvas doesn't block UI clicks)
    window.addEventListener('pointerdown', handleGlobalPointerDown, {passive:true});

    // resize
    let resizeTimer = null; window.addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer = setTimeout(()=>{ resizeBubbleCanvas(); }, 120); }, {passive:true});

    // errors
    window.addEventListener('error', ()=>{ try{ const splash = document.getElementById('splashScreen'); if(splash) splash.style.display='none'; revealUI(); }catch(e){} });
    window.addEventListener('unhandledrejection', ()=>{ revealUI(); });

    // init
    resizeBubbleCanvas(); // do not start loop until click

    // debug
    window.__dbgState = function(){ return { uiRevealed, animationsStarted, bubbleLoopActive:!!bubbleRAF, playAttempted, bubblesCount: bubbles.length, particlesCount: particles.length, video: (document.getElementById('bgVideo')?{paused:document.getElementById('bgVideo').paused, muted:document.getElementById('bgVideo').muted}:null) }; };
  </script>
</body>
</html>
