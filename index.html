<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #000; overflow-x: hidden; position: relative;
        }

        /* Background video */
        #bgVideo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -3;
        }
        body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.28); z-index: -2; }

        /* Splash overlay (click to unmute/enter) */
        #splashScreen { position: fixed; inset: 0; display:flex; align-items:center; justify-content:center; z-index:1000; cursor:pointer; }
        #splashScreen .overlay-text { font-family: 'Courier New', monospace; color:#fff; font-size:22px; letter-spacing:0.18em; text-transform:uppercase; background: rgba(0,0,0,0.45); padding: 18px 26px; border-radius: 12px; }
        #splashScreen.hidden { display: none; }

        /* Main glass container */
        .glass-container {
            background: rgba(255,255,255,0.02); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(138,43,226,0.12); border-radius: 22px; padding: 28px 20px; width: 92%; max-width: 420px;
            box-shadow: 0 8px 40px rgba(102,126,234,0.06); text-align:center; z-index: 10;
        }

        .profile-image { width: 100px; height:100px; border-radius:50%; object-fit:cover; margin:0 auto 14px; border:1px solid rgba(255,255,255,0.12); }
        .name { font-size:26px; color:#fff; letter-spacing:6px; text-transform:uppercase; margin-bottom:8px; }
        .bio { color: rgba(255,255,255,0.9); margin-bottom: 18px; }

        /* Links grid - two rows layout that doesn't feel suffocating */
        .links-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-items: center; justify-items: center;
        }
        /* On small screens use 3 columns then 2 */
        @media (max-width: 420px) { .links-grid { grid-template-columns: repeat(3,1fr); } }
        @media (max-width: 320px) { .links-grid { grid-template-columns: repeat(2,1fr); gap:8px; } }

        .link-btn {
            display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:10px 12px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06); color:#fff; text-decoration:none; font-weight:600; border-radius: 12px;
            transition: transform 140ms cubic-bezier(.2,.9,.3,1), box-shadow 140ms ease, background 140ms ease;
            -webkit-tap-highlight-color: transparent;
        }
        .link-btn:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(102,126,234,0.08); }
        .link-btn:active, .link-btn.touch-press { transform: translateY(-1px) scale(0.995); box-shadow: 0 4px 12px rgba(102,126,234,0.06); }

        /* Snowfall visuals */
        #snowContainer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
        .snowflake {
            position: absolute; top: -40px; width: 10px; height: 10px; pointer-events: auto;
            border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0.65) 40%, rgba(255,255,255,0.18) 70%);
            box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 2px 6px rgba(255,255,255,0.35);
            opacity: 0.9; transform-origin: center; will-change: transform, opacity;
            transition: transform 120ms ease-out;
        }
        .snow-melt { animation: melt 300ms forwards ease; }
        @keyframes melt { to { transform: scale(0.2) translateY(12px); opacity: 0; } }

        /* small accessibility tweaks */
        .links-grid .link-btn span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* Responsive glass padding */
        @media (max-width: 480px) { .glass-container { padding: 20px 14px; } }
    </style>
</head>
<body>
    <audio id="popSound" preload="auto"><source src="pop.mp4" type="audio/mp4"></audio>

    <!-- Background video: autoplay muted so it shows immediately; unmute on user gesture via overlay -->
    <video id="bgVideo" autoplay muted playsinline loop>
        <source src="Cowboy.mp4" type="video/mp4">
    </video>

    <div id="snowContainer" aria-hidden="true"></div>

    <!-- Full-screen landing overlay -->
    <div id="splashScreen"><div class="overlay-text">Click to enter...</div></div>

    <!-- Glass container with content and two-row buttons -->
    <div class="glass-container" id="glassContainer">
        <img src="pfp.jpg" alt="Profile" class="profile-image">
        <h1 class="name">AFFLY</h1>
        <p class="bio">Trying to survive another boring day...</p>

        <div class="links-grid" id="linksGrid">
            <a class="link-btn" href="#">Affly Intel</a>
            <a class="link-btn" href="#">$AFFLY</a>
            <a class="link-btn" href="#">Affly Forge</a>
            <a class="link-btn" href="#">Affly Systems</a>
            <a class="link-btn" href="#">Affly Games</a>
            <a class="link-btn" href="#">Affly Media</a>
            <a class="link-btn" href="#">Affly Network</a>
        </div>
    </div>

    <script>
        // --- Video / splash behaviour ---
        const splashScreen = document.getElementById('splashScreen');
        const video = document.getElementById('bgVideo');
        let entered = false;
        function enterApp() {
            if (entered) return; entered = true;
            splashScreen.classList.add('hidden');
            // try to unmute (user gesture)
            try { video.muted = false; video.play().catch(()=>{}); }
            catch(e){}
        }
        splashScreen.addEventListener('click', enterApp, {passive:true});

        // --- Snowfall system ---
        const snowContainer = document.getElementById('snowContainer');
        const popAudio = document.getElementById('popSound');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function synthPop() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const len = audioCtx.sampleRate * 0.05; const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const d = buf.getChannelData(0); for (let i=0;i<len;i++){ const p=i/len; d[i]=(Math.random()*2-1)*(1-p)*0.18; }
            const s = audioCtx.createBufferSource(); s.buffer=buf; const f=audioCtx.createBiquadFilter(); f.type='highpass'; f.frequency.value=1200; s.connect(f).connect(audioCtx.destination); s.start();
        }
        function playPop(){ try{ popAudio.currentTime=0; const p=popAudio.play(); if(p&&p.catch) p.catch(()=>synthPop()); }catch(e){ synthPop(); } }

        let flakes = [];
        function rand(min,max){ return Math.random()*(max-min)+min; }
        function createFlake() {
            // limit flakes
            if (flakes.length > 140) return;
            const el = document.createElement('div'); el.className='snowflake';
            const size = Math.round(rand(8, 20)); el.style.width=`${size}px`; el.style.height=`${size}px`;
            const left = Math.round(rand(6, window.innerWidth - size - 6)); el.style.left = left + 'px';
            const speed = rand(1.2, 3.6); // px per frame multiplier (higher = faster)
            const drift = rand(-0.6, 0.6);
            el.dataset.vx = drift; el.dataset.vy = speed; el.dataset.size = size;

            // clicking or tapping flake triggers pop + small melt animation
            el.addEventListener('click', (e)=>{ e.stopPropagation(); el.classList.add('snow-melt'); playPop(); setTimeout(()=>{ if(el.parentElement) el.remove(); flakes = flakes.filter(f=>f.el!==el); }, 320); }, {passive:true});
            el.addEventListener('touchstart', (e)=>{ e.stopPropagation(); el.classList.add('snow-melt'); playPop(); setTimeout(()=>{ if(el.parentElement) el.remove(); flakes = flakes.filter(f=>f.el!==el); }, 320); }, {passive:true});

            snowContainer.appendChild(el);
            flakes.push({el, x: left, y: -40, vx: drift, vy: speed, size});
        }

        let last = performance.now();
        function tick(now){ const dt = Math.min(now - last, 40); last = now; const friction = 0.98;
            for (let i=flakes.length-1;i>=0;i--){ const f=flakes[i]; f.vx *= friction; f.vy = f.vy; f.x += f.vx * (dt/16.67) * 1.6; f.y += f.vy * (dt/16.67);
                const sway = Math.sin((now/600) + i) * (f.size*0.04);
                f.el.style.transform = `translate(${f.x + sway}px, ${f.y}px) rotate(${(f.x+f.y)%360}deg)`;
                if (f.y > window.innerHeight - 18) {
                    // melt on ground
                    f.el.classList.add('snow-melt'); playPop();
                    setTimeout(()=>{ if(f.el.parentElement) f.el.parentElement.removeChild(f.el); }, 300);
                    flakes.splice(i,1);
                }
            }
            requestAnimationFrame(tick);
        }

        // Start snowfall automatically so user sees effect immediately
        function startSnow() {
            // spawn rate tuned: noticeable but not overwhelming
            const rate = (window.innerWidth < 600) ? 160 : 90; // ms
            // create a few immediately
            for (let i=0;i<12;i++) setTimeout(createFlake, i*80);
            setInterval(()=>{ createFlake(); }, rate);
            requestAnimationFrame(tick);
        }

        // Start snow immediately so changes are visible without extra gestures
        startSnow();

        // --- Buttons: touch feedback (add and remove class) ---
        const buttons = document.querySelectorAll('.link-btn');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', ()=> btn.classList.add('touch-press'), {passive:true});
            btn.addEventListener('touchend', ()=> btn.classList.remove('touch-press'), {passive:true});
            btn.addEventListener('mousedown', ()=> btn.classList.add('touch-press'));
            btn.addEventListener('mouseup', ()=> btn.classList.remove('touch-press'));
            btn.addEventListener('mouseleave', ()=> btn.classList.remove('touch-press'));
        });

        // Keep video unmute attempt on first interaction anywhere (extra convenience)
        document.addEventListener('click', function onceUnmute(){ try{ video.muted=false; video.play().catch(()=>{}); }catch(e){} document.removeEventListener('click', onceUnmute); }, {passive:true});

        // Make layout visually balanced: if 7 buttons, grid auto-wrap ensures two rows. No extra JS needed.

        // Handle resize: ensure flakes remain within bounds
        window.addEventListener('resize', ()=>{ flakes.forEach(f=>{ f.x = Math.min(Math.max(6, f.x), window.innerWidth - (f.size+6)); }); });
    </script>
</body>
</html>
