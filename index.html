<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Link in Bio</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#000;display:flex;align-items:center;justify-content:center;position:relative}

    /* Background video */
    #bgVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4}
    body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,0.28),rgba(0,0,0,0.36));z-index:-3}

    /* Storm canvas (below bubbles) */
    #stormCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:-2;mix-blend-mode:screen;display:block;will-change:transform}

    /* Bubble canvas sits above storm but below UI; pointer-events:none since clicks are handled globally */
    #bubbleCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:-1;display:block}

    /* Splash overlay - visible until user clicks */
    #splashScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000;background:rgba(0,0,0,0.65);cursor:pointer}
    #splashScreen .overlay-text{color:#fff;font-family:'Courier New',monospace;font-size:22px;letter-spacing:.18em;padding:18px 28px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01))}
    #splashScreen.hidden{display:none}

    /* Glass panel (card) with soft white glow */
    .glass-container{position:relative;z-index:10;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;padding:22px 26px;max-width:760px;width:92%;text-align:center;transition:transform 220ms ease-out;box-shadow:0 8px 40px rgba(255,255,255,0.04), 0 2px 8px rgba(255,255,255,0.02);}
    .glass-container::after{content:'';position:absolute;inset:-8px;border-radius:24px;pointer-events:none;box-shadow:0 0 40px 6px rgba(138,43,226,0.08);filter:blur(6px);opacity:1}

    /* Avatar with coin flip animation */
    .profile-image{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 12px;border:2px solid rgba(255,255,255,0.08);transform-origin:center;backface-visibility:hidden}
    @keyframes coinFlip { 0%{transform:perspective(600px) rotateX(80deg) scale(0.6)} 40%{transform:perspective(600px) rotateX(-16deg) scale(1.05)} 70%{transform:perspective(600px) rotateX(6deg) scale(0.98)} 100%{transform:perspective(600px) rotateX(0deg) scale(1)} }

    .name{color:#fff;font-size:24px;letter-spacing:6px;text-transform:uppercase;margin-bottom:6px;opacity:0;display:inline-block}
    .bio{color:rgba(255,255,255,0.9);margin-bottom:16px;opacity:0;display:inline-block}

    /* animated entrance - will stagger via inline style delays */
    @keyframes appearDown {from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

    /* Links grid: 4 columns (2 rows on desktop) */
    .links-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    @media(max-width:420px){.links-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:320px){.links-grid{grid-template-columns:repeat(2,1fr);gap:8px}}

    /* Buttons: soft background, inner glow on press */
    .link-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));color:rgba(255,255,255,0.95);text-decoration:none;transition:box-shadow 180ms ease, transform 180ms ease}
    .link-btn:active, .link-btn.active{box-shadow:0 8px 30px rgba(255,255,255,0.12), inset 0 0 18px rgba(255,255,255,0.06)}

    /* Magnetic target style (will be transformed via JS) */
    .magnetic{will-change:transform}

    /* subtle shimmer on buttons/text when appear */
    @keyframes shimmer{0%{filter:drop-shadow(0 0 0 rgba(138,43,226,0))}50%{filter:drop-shadow(0 0 14px rgba(138,43,226,0.12))}100%{filter:drop-shadow(0 0 0 rgba(138,43,226,0))}}

    /* small enable-sound toggle */
    #soundToggle{position:fixed;right:12px;bottom:12px;z-index:1200;background:rgba(255,255,255,0.03);color:#fff;border:1px solid rgba(255,255,255,0.04);padding:8px 10px;border-radius:10px;font-size:13px;cursor:pointer}

  </style>
</head>
<body>
  <video id="bgVideo" muted playsinline loop>
    <source src="Cowboy.mp4" type="video/mp4">
  </video>

  <!-- Storm canvas -->
  <canvas id="stormCanvas" aria-hidden="true"></canvas>
  <!-- Bubble canvas -->
  <canvas id="bubbleCanvas" aria-hidden="true"></canvas>

  <div id="splashScreen"><div class="overlay-text">Click to enter...</div></div>

  <div class="glass-container" id="glassContainer">
    <img src="pfp.jpg" alt="Profile" class="profile-image" id="pfp">
    <h1 class="name" id="nameEl"></h1>
    <p class="bio" id="bioEl"></p>

    <div class="links-grid" id="linksGrid">
      <a class="link-btn magnetic" href="#">Affly Intel</a>
      <a class="link-btn magnetic" href="#">$AFFLY</a>
      <a class="link-btn magnetic" href="#">Affly Forge</a>
      <a class="link-btn magnetic" href="#">Affly Systems</a>
      <a class="link-btn magnetic" href="#">Affly Games</a>
      <a class="link-btn magnetic" href="#">Affly Media</a>
      <a class="link-btn magnetic" href="#">Affly Network</a>
      <a class="link-btn magnetic" href="#">Affly Socials</a>
    </div>
  </div>

  <button id="soundToggle" aria-pressed="false">Enable Sound</button>

  <script>
    // --- Small helpers ---
    function rand(min,max){return Math.random()*(max-min)+min}
    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

    // --- Audio: Pop synth for bubbles + integration with AudioManager if present ---
    let audioCtx = null; let audioUnlocked = false;
    function ensureAudioContext(){ if (!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; } } }
    function unlockAudioOnGesture(){ if(audioUnlocked) return; ensureAudioContext(); if(!audioCtx) return; // create a tiny click sound to unlock
      const g = audioCtx.createGain(); g.gain.value = 0.0001; g.connect(audioCtx.destination);
      const o = audioCtx.createOscillator(); o.type='square'; o.frequency.value = 300; o.connect(g); o.start(0); o.stop(0.02);
      audioUnlocked = true; }
    // synthesized pop
    function playPopSound(){ ensureAudioContext(); if(!audioCtx || !audioUnlocked) return; const now = audioCtx.currentTime; const g = audioCtx.createGain(); g.connect(audioCtx.destination); g.gain.value = 0.0001; const b = audioCtx.createBiquadFilter(); b.type='highpass'; b.frequency.value=600; const noiseLen = 0.08; const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * noiseLen, audioCtx.sampleRate); const data = buffer.getChannelData(0); for(let i=0;i<data.length;i++){ data[i] = (Math.random()*2-1) * Math.exp(-i/data.length*4); } const src = audioCtx.createBufferSource(); src.buffer = buffer; src.connect(b); b.connect(g); // envelope
      g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(0.16, now + 0.008); g.gain.exponentialRampToValueAtTime(0.001, now + 0.12); src.start(now); src.stop(now + noiseLen + 0.02);
    }

    // If a repository-level AudioManager exists, init it too on gesture
    function tryInitGlobalAudio(){ if(window.AudioManager && typeof window.AudioManager.init === 'function') try{ window.AudioManager.init(); }catch(e){} }

    // --- Bubble System ---
    const bubbleCanvas = document.getElementById('bubbleCanvas');
    const bCtx = bubbleCanvas.getContext('2d');
    let bW = 0, bH = 0, bDPR = 1;
    const bubbles = []; // pool
    const bubbleParticles = []; // burst particles
    const MAX_BUBBLES = 80;

    function resizeBubbleCanvas(){ bDPR = Math.min(window.devicePixelRatio || 1, 2); bW = window.innerWidth; bH = window.innerHeight; bubbleCanvas.width = Math.floor(bW * bDPR); bubbleCanvas.height = Math.floor(bH * bDPR); bubbleCanvas.style.width = bW+'px'; bubbleCanvas.style.height = bH+'px'; bCtx.setTransform(bDPR,0,0,bDPR,0,0); }

    function createBubble(){ if(bubbles.length >= MAX_BUBBLES) return; const r = rand(8, 40); const x = rand(r, bW - r); const y = bH + r + rand(0, 60); const vy = -rand(30, 140); const vx = rand(-12,12); const alpha = rand(0.12,0.32); const id = Math.random().toString(36).slice(2,9); bubbles.push({id,x,y,r,vy,vx,alpha,age:0}); }

    function popBubble(b){ // create burst particles
      const count = Math.round(clamp(b.r/6,4,12)); for(let i=0;i<count;i++){ const angle = rand(0,Math.PI*2); const speed = rand(40,220); bubbleParticles.push({x:b.x,y:b.y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:0.28+Math.random()*0.36, r:rand(1.5,4.0), age:0}); }
      // play sound
      playPopSound();
    }

    function updateBubbles(dt){ // dt in seconds
      // spawn occasionally
      if(Math.random() < 0.02) createBubble();
      for(let i=bubbles.length-1;i>=0;i--){ const p=bubbles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.age += dt; // drift
        // collision with edges -> pop
        if(p.x - p.r <= 0 || p.x + p.r >= bW || p.y - p.r <= 0){ popBubble(p); bubbles.splice(i,1); continue; }
        // lifetime: if fully above screen, remove
        if(p.y + p.r < -40){ bubbles.splice(i,1); continue; }
      }
      // update particles
      for(let i=bubbleParticles.length-1;i>=0;i--){ const sp=bubbleParticles[i]; sp.vy += 600 * dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.age += dt; sp.r *= 0.98; if(sp.age >= sp.life) bubbleParticles.splice(i,1); }
    }

    function drawBubbles(){ bCtx.clearRect(0,0,bW,bH); // draw bubbles
      for(const p of bubbles){ bCtx.save(); // soft translucent bubble with subtle rim
        const grd = bCtx.createRadialGradient(p.x - p.r*0.25, p.y - p.r*0.35, p.r*0.1, p.x, p.y, p.r); grd.addColorStop(0, `rgba(255,255,255,${p.alpha*0.9})`); grd.addColorStop(0.4, `rgba(220,240,255,${p.alpha*0.24})`); grd.addColorStop(1, `rgba(140,190,230,${p.alpha*0.14})`);
        bCtx.fillStyle = grd; bCtx.beginPath(); bCtx.arc(p.x,p.y,p.r,0,Math.PI*2); bCtx.fill(); // rim
        bCtx.strokeStyle = `rgba(255,255,255,${p.alpha*0.45})`; bCtx.lineWidth = 1; bCtx.stroke(); bCtx.restore(); }
      // draw particles
      for(const sp of bubbleParticles){ bCtx.save(); bCtx.globalAlpha = Math.max(0, 1 - (sp.age/sp.life)); bCtx.fillStyle = 'rgba(255,255,255,0.92)'; bCtx.beginPath(); bCtx.arc(sp.x, sp.y, sp.r, 0, Math.PI*2); bCtx.fill(); bCtx.restore(); }
    }

    // detect clicks/taps — since bubble canvas is pointer-events:none, we listen globally
    function handlePointerDown(e){ const rect = {left:0,top:0}; const x = (e.touches?e.touches[0].clientX:e.clientX); const y = (e.touches?e.touches[0].clientY:e.clientY); // find topmost bubble under pointer
      for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i]; const dx = x - b.x; const dy = y - b.y; if(dx*dx + dy*dy <= b.r*b.r){ popBubble(b); bubbles.splice(i,1); break; } }
      // unlock audio on first gesture
      unlockAudioOnGesture(); tryInitGlobalAudio(); }

    // Edge collision pop: handled in update loop when position touches edges

    // --- Magnetic button effect & button animations ---
    const magneticEls = Array.from(document.querySelectorAll('.magnetic'));
    const pointer = {x: window.innerWidth/2, y: window.innerHeight/2};
    let magneticRAF = null;
    function onPointerMove(e){ pointer.x = e.clientX; pointer.y = e.clientY; if(!magneticRAF) magneticRAF = requestAnimationFrame(updateMagnetic); }
    function updateMagnetic(){ magneticRAF = null; for(const el of magneticEls){ const r = el.getBoundingClientRect(); const cx = r.left + r.width/2; const cy = r.top + r.height/2; const dx = pointer.x - cx; const dy = pointer.y - cy; const dist = Math.hypot(dx,dy); const maxDist = Math.max(120, r.width*1.2); if(dist < maxDist){ const strength = (1 - (dist/maxDist)); const tx = clamp(dx * 0.18 * strength, -16, 16); const ty = clamp(dy * 0.12 * strength, -10, 10); el.style.transform = `translate(${tx}px, ${ty}px) scale(${1 + 0.02*strength})`; el.style.boxShadow = `0 ${6*strength}px ${18*strength}px rgba(168,144,255,${0.08 + 0.06*strength})`; } else { el.style.transform = ''; el.style.boxShadow = ''; } } }
    function onPointerLeave(){ if(magneticRAF){ cancelAnimationFrame(magneticRAF); magneticRAF = null; } magneticEls.forEach(el=>{ el.style.transform=''; el.style.boxShadow=''; }); }

    // --- Page Load Animations: Avatar flip + typewriter + staggered buttons ---
    const nameText = 'AFFLY';
    const bioText = 'Trying to survive another boring day...';
    function animateAvatar(){ const img = document.getElementById('pfp'); img.style.animation = 'coinFlip 900ms cubic-bezier(.2,.9,.25,1)'; img.addEventListener('animationend', ()=>{ img.style.animation=''; }); }

    async function typeWriter(el, text, speed=48){ el.textContent = ''; for(let i=0;i<text.length;i++){ el.textContent += text[i]; await new Promise(r=>setTimeout(r, speed + Math.random()*12)); } }

    function animateEntrance(){ // card slight pop + staggered buttons
      const card = document.getElementById('glassContainer'); card.style.opacity = 0; card.style.transform = 'translateY(-8px)'; requestAnimationFrame(()=>{ card.style.transition = 'transform 420ms cubic-bezier(.2,.9,.2,1), opacity 380ms ease'; card.style.opacity = 1; card.style.transform = 'translateY(0)'; });
      // stagger buttons
      magneticEls.forEach((el,i)=>{ el.style.opacity = 0; el.style.transform += ' translateY(-10px)'; setTimeout(()=>{ el.style.transition = 'transform 420ms cubic-bezier(.2,.9,.2,1), opacity 300ms ease'; el.style.opacity=1; el.style.transform = el.style.transform.replace(' translateY(-10px)',''); }, 380 + i*70); }); }

    // --- Integrate with existing StormEngine: ensure storm starts independently of clicks ---
    try{ if(window.StormEngine && typeof window.StormEngine.start === 'function'){ /* don't auto-start sound here */ } }catch(e){}

    // --- Main loop for bubbles ---
    let lastFrame = performance.now();
    function frame(now){ const dt = Math.min(0.045, (now - lastFrame)/1000); updateBubbles(dt); drawBubbles(); lastFrame = now; requestAnimationFrame(frame); }

    // Events
    window.addEventListener('resize', ()=>{ resizeBubbleCanvas(); }, {passive:true});
    window.addEventListener('pointerdown', handlePointerDown, {passive:true});
    window.addEventListener('mousemove', onPointerMove, {passive:true});
    window.addEventListener('mouseleave', onPointerLeave, {passive:true});

    // Sound toggle
    const soundToggle = document.getElementById('soundToggle');
    let soundEnabled = localStorage.getItem('affly_sound') === '1';
    function updateSoundUI(){ soundToggle.textContent = soundEnabled? 'Sound: On' : 'Enable Sound'; soundToggle.setAttribute('aria-pressed', soundEnabled? 'true':'false'); }
    soundToggle.addEventListener('click', ()=>{ soundEnabled = !soundEnabled; localStorage.setItem('affly_sound', soundEnabled? '1':'0'); if(soundEnabled){ unlockAudioOnGesture(); tryInitGlobalAudio(); } updateSoundUI(); });
    updateSoundUI();

    // Unlock audio when user clicks splash; but thunder shouldn't be tied to click
    document.addEventListener('pointerdown', ()=>{ if(soundEnabled) unlockAudioOnGesture(); }, {passive:true});

    // Boot
    resizeBubbleCanvas(); frame(performance.now()); // start bubble loop

    // Run load animations when splash clicked
    splash.addEventListener('click', ()=>{
      splash.classList.add('hidden');
      try{ video.muted=false; video.play().catch(()=>{}); }catch(e){}
      animateAvatar(); animateEntrance(); // typewriter
      (async ()=>{ await typeWriter(nameEl, nameText, 48); await new Promise(r=>setTimeout(r,200)); await typeWriter(bioEl, bioText, 28); })();
      // initialize global audio if user allowed
      if(localStorage.getItem('affly_sound')==='1') { unlockAudioOnGesture(); tryInitGlobalAudio(); }
      // start storm engine (if available)
      try{ if(window.StormEngine){ window.StormEngine.setIntensity(1.0); window.StormEngine.start(); } }catch(e){}
    }, {passive:true});

    // Accessibility: allow Enter key to enter (start)
    document.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !splash.classList.contains('hidden')){ splash.click(); } });

  </script>
</body>
</html>
