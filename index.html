<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Link in Bio</title>
  <style>
    /* Design tokens & refined baseline */
    :root{
      --bg: #05060a;
      --panel-bg: rgba(255,255,255,0.02);
      --muted: rgba(255,255,255,0.72);
      --text: #f6f6f7;
      --accent: #C9A95B;
      --radius-lg: 24px;
      --radius-md: 12px;
      --ease-standard: cubic-bezier(.22,.9,.3,1);
      --ease-slow: cubic-bezier(.16,.85,.28,1);
      --short: 280ms;
      --medium: 560ms;
      --long: 920ms;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;position:relative}

    /* Background video and dimmer */
    #bgVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4}
    body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,0.28),rgba(0,0,0,0.36));z-index:-3;pointer-events:none}

    /* Canvases */
    #stormCanvas, #bubbleCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;display:block}
    #stormCanvas{z-index:-2;mix-blend-mode:screen;will-change:transform}
    #bubbleCanvas{z-index:-1}

    /* Splash overlay */
    #splashScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1050;background:rgba(0,0,0,0.65);cursor:pointer;transition:opacity .5s var(--ease-standard)}
    #splashScreen .overlay-text{color:#fff;font-family:'Courier New',monospace;font-size:18px;letter-spacing:.14em;padding:14px 22px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01))}
    #splashScreen.overlay-hidden{opacity:0;pointer-events:none}

    /* Glass panel */
    .glass-container{position:relative;z-index:10;background:linear-gradient(180deg,var(--panel-bg),rgba(255,255,255,0.01));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:var(--radius-lg);padding:28px;width:min(760px,92vw);box-shadow:0 6px 30px rgba(0,0,0,0.6);transition:box-shadow var(--medium) var(--ease-standard),transform var(--medium) var(--ease-standard)}
    .glass-container::after{content:'';position:absolute;inset:-8px;border-radius:var(--radius-lg);pointer-events:none;box-shadow:0 0 60px 10px rgba(201,169,91,0.06);filter:blur(6px);opacity:1;transition:opacity var(--medium) var(--ease-standard)}

    .profile-row{display:flex;align-items:center;gap:14px;justify-content:center}
    .profile-image{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0;border:2px solid rgba(255,255,255,0.06);transform-origin:center;backface-visibility:hidden;will-change:transform}

    .name{color:var(--text);font-size:26px;letter-spacing:0.12em;text-transform:uppercase;margin:0;opacity:0;position:relative}
    .bio{color:var(--muted);margin:6px 0 16px;opacity:0;transform:translateY(6px)}

    /* refined fall-in */
    .fall { opacity:0; transform: translateY(-18px) scale(0.998); will-change:transform,opacity; }
    .fall.in { opacity:1; transform:none; transition: transform var(--medium) var(--ease-standard), opacity calc(var(--medium) - 120ms) ease; }

    /* links grid and buttons */
    .links-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;opacity:0;transform:translateY(6px) scale(0.999);transition:opacity var(--short) var(--ease-standard),transform var(--short) var(--ease-standard)}
    .site-started .links-grid{opacity:1;transform:none}
    .link-btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));color:var(--muted);font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,0.45);transition: transform 320ms var(--ease-standard), box-shadow 320ms var(--ease-standard), background-color 320ms var(--ease-standard)}
    .link-btn:hover{ transform: translateY(-3px); box-shadow:0 18px 48px rgba(0,0,0,0.5); color:var(--text); background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)); }
    .link-btn:active{ transform: translateY(-1px) }

    @media(max-width:420px){.links-grid{grid-template-columns:repeat(3,1fr)} }
    @media(max-width:320px){.links-grid{grid-template-columns:repeat(2,1fr);gap:8px}}

    /* per-character CSS reveal */
    @keyframes charReveal { from { opacity:0; transform: translateY(8px) scale(1.01); filter: blur(1px); } to { opacity:1; transform: translateY(0) scale(1); filter: blur(0); } }
    .char-pop{ display:inline-block; opacity:0; transform:translateY(8px); will-change:transform,opacity; }
    .char-pop.revealed{ animation: charReveal 460ms var(--ease-slow) both; }

    /* bio reveal */
    .bio.in { opacity:1; transform:none; transition: opacity 420ms var(--ease-slow), transform 420ms var(--ease-slow); }

    /* subtle per-char baseline for JS fallback */
    @media (prefers-reduced-motion: reduce){
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      #bubbleCanvas, #stormCanvas { display:none !important; }
    }
  </style>
</head>
<body>
  <video id="bgVideo" playsinline webkit-playsinline autoplay loop preload="auto" muted>
    <source src="Cowboy.mp4" type="video/mp4">
  </video>

  <canvas id="stormCanvas" aria-hidden="true"></canvas>
  <canvas id="bubbleCanvas" aria-hidden="true"></canvas>

  <div id="splashScreen"><div class="overlay-text">Click to enter...</div></div>

  <div class="glass-container fall" id="glassContainer">
    <div class="profile-row">
      <img src="pfp.jpg" alt="Profile" class="profile-image" id="pfp">
      <div style="position:relative;">
        <h1 class="name" id="nameEl"></h1>
        <p class="bio" id="bioEl"></p>
      </div>
    </div>

    <div class="links-grid" id="linksGrid">
      <a class="link-btn magnetic" href="#">Affly Intel</a>
      <a class="link-btn magnetic" href="#">$AFFLY</a>
      <a class="link-btn magnetic" href="#">Affly Forge</a>
      <a class="link-btn magnetic" href="#">Affly Systems</a>
      <a class="link-btn magnetic" href="#">Affly Games</a>
      <a class="link-btn magnetic" href="#">Affly Media</a>
      <a class="link-btn magnetic" href="#">Affly Network</a>
      <a class="link-btn magnetic" href="#">Affly Socials</a>
    </div>
  </div>

  <script>
    // Basic environment
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) || window.matchMedia('(pointer:coarse)').matches;
    const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* --- Helpers --- */
    const rand = (min,max) => Math.random()*(max-min)+min;
    const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

    /* --- Bubble canvas (refined) --- */
    const bubbleCanvas = document.getElementById('bubbleCanvas');
    const bCtx = bubbleCanvas.getContext('2d');
    let bW = 0, bH = 0, bDPR = 1; const bubbles = []; const bubbleParticles = [];
    let MAX_BUBBLES = isTouch ? 40 : 120;

    function resizeBubbleCanvas(){
      bDPR = isTouch ? 1 : Math.min(window.devicePixelRatio || 1, 2);
      bW = window.innerWidth; bH = window.innerHeight;
      bubbleCanvas.width = Math.floor(bW * bDPR); bubbleCanvas.height = Math.floor(bH * bDPR);
      bubbleCanvas.style.width = bW+'px'; bubbleCanvas.style.height = bH+'px'; bCtx.setTransform(bDPR,0,0,bDPR,0,0);
      if(typeof bCtx.imageSmoothingEnabled !== 'undefined') bCtx.imageSmoothingEnabled = true;
      const initial = Math.floor(MAX_BUBBLES * (isTouch ? 0.45 : 0.3));
      while(bubbles.length < initial) createBubble();
    }

    function createBubble(){
      if(bubbles.length >= MAX_BUBBLES) return;
      const r = rand(isTouch ? 10 : 18, isTouch ? 36 : 64);
      const x = rand(r, bW - r);
      const y = bH + r + rand(0, 80);
      const vy = -rand(isTouch ? 12 : 22, isTouch ? 28 : 60);
      const vx = rand(-6,6);
      const alpha = isTouch ? rand(0.18,0.45) : rand(0.08,0.28);
      const hue = 220 + Math.random()*40;
      const wobbleAmp = rand(6, 22) * (r/36);
      const wobbleFreq = rand(0.3, 0.9);
      const pulse = {amp: rand(0.01,0.04), freq: rand(0.4,1.0)};
      bubbles.push({x, y, baseX:x, r, vy, vx, alpha, age:0, hue, wobble: Math.random()*Math.PI*2, wobbleAmp, wobbleFreq, pulse});
    }

    function popBubble(b){ const count = Math.round(clamp(b.r/8, isTouch?2:3, isTouch?8:10)); for(let i=0;i<count;i++){ const angle = rand(0,Math.PI*2); const speed = rand(20,120); bubbleParticles.push({x:b.x,y:b.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,age:0,life:0.6,r:Math.max(1,b.r*0.18)}); } }

    function updateBubbles(dt){ if(Math.random() < (isTouch ? 0.12 : 0.04)) createBubble(); for(let i=bubbles.length-1;i>=0;i--){ const p=bubbles[i]; p.age += dt; p.wobble += dt * p.wobbleFreq * 2 * Math.PI; p.x = p.baseX + Math.sin(p.wobble) * p.wobbleAmp + p.vx * p.age * 0.01; p.y += p.vy * dt + Math.sin(p.age * 2.0) * (p.r*0.0015); p.currentR = p.r * (1 + Math.sin(p.age * p.pulse.freq * Math.PI * 2) * p.pulse.amp); if(p.x - p.currentR <= 0 || p.x + p.currentR >= bW || p.y - p.currentR <= 0){ popBubble(p); bubbles.splice(i,1); continue; } if(p.y + p.currentR < -120){ bubbles.splice(i,1); continue; } }
      for(let i=bubbleParticles.length-1;i>=0;i--){ const sp=bubbleParticles[i]; sp.vy += 600 * dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.age += dt; sp.r *= 0.985; if(sp.age >= sp.life) bubbleParticles.splice(i,1); }
    }

    function drawBubbles(){ bCtx.clearRect(0,0,bW,bH); bCtx.globalCompositeOperation = 'lighter'; for(const p of bubbles){ bCtx.save(); const r = p.currentR || p.r; if(!isTouch){ bCtx.shadowBlur = Math.max(8, r * 0.9); bCtx.shadowColor = `hsla(${p.hue}, 85%, 68%, ${p.alpha*0.85})`; } const inner = r * 0.12; const grd = bCtx.createRadialGradient(p.x - r*0.25, p.y - r*0.35, inner, p.x, p.y, r); grd.addColorStop(0, `hsla(${p.hue}, 85%, 92%, ${p.alpha})`); grd.addColorStop(0.5, `hsla(${p.hue}, 85%, 78%, ${p.alpha*0.75})`); grd.addColorStop(1, `rgba(255,255,255,0)`); bCtx.fillStyle = grd; bCtx.beginPath(); bCtx.arc(p.x, p.y, r, 0, Math.PI*2); bCtx.fill(); bCtx.lineWidth = Math.max(0.4, r * 0.02); bCtx.strokeStyle = `rgba(255,255,255,${isTouch?0.06:0.04})`; bCtx.stroke(); bCtx.restore(); } bCtx.globalCompositeOperation = 'source-over'; for(const sp of bubbleParticles){ bCtx.save(); bCtx.fillStyle = 'rgba(255,255,255,0.92)'; bCtx.beginPath(); bCtx.arc(sp.x, sp.y, sp.r, 0, Math.PI*2); bCtx.fill(); bCtx.restore(); } }

    /* Pointer interactions: popping */
    function handlePointerDown(e){ const x = (e.touches?e.touches[0].clientX:e.clientX); const y = (e.touches?e.touches[0].clientY:e.clientY); for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i]; const dx = x - b.x; const dy = y - b.y; if(dx*dx + dy*dy <= (b.currentR||b.r)*(b.currentR||b.r)){ popBubble(b); bubbles.splice(i,1); } } }

    /* Magnetic buttons (subtle) */
    const magneticEls = !isTouch ? Array.from(document.querySelectorAll('.magnetic')) : [];
    const pointer = {x: window.innerWidth/2, y: window.innerHeight/2}; let magneticRAF = null;
    function onPointerMove(e){ pointer.x = e.clientX; pointer.y = e.clientY; if(!magneticRAF) magneticRAF = requestAnimationFrame(updateMagnetic); }
    function updateMagnetic(){ magneticRAF = null; for (const el of magneticEls) { const r = el.getBoundingClientRect(); const cx = r.left + r.width/2; const cy = r.top + r.height/2; const dx = pointer.x - cx; const dy = pointer.y - cy; const dist = Math.hypot(dx,dy); const max = 88; if(dist < max){ const t = (1 - (dist/max)); const tx = dx * 0.07 * t; const ty = dy * 0.03 * t; el.style.transform = `translate(${tx}px, ${ty}px) scale(${1 + 0.008 * t})`; el.style.boxShadow = `0 ${6 + 20*t}px ${18 + 40*t}px rgba(0,0,0,0.45)`; } else { el.style.transform=''; el.style.boxShadow=''; } } }
    function onPointerLeave(){ if(magneticRAF){ cancelAnimationFrame(magneticRAF); magneticRAF = null; } magneticEls.forEach(el=>{ el.style.transform=''; el.style.boxShadow=''; }); }

    /* --- Page animations: avatar toss, spider crawl reveal, bio reveal --- */
    const nameText = 'AFFLY';
    const bioText = 'Trying to survive another boring day.....';

    function animateAvatarToss(){
      const img = document.getElementById('pfp');
      const up = -140 - Math.min(window.innerHeight*0.06, 80);
      const keyframes = [
        { transform: 'translateY(0px) rotateZ(0deg) scale(1)', offset:0 },
        { transform: `translateY(${up}px) rotateZ(16deg) scale(1.02)`, offset:0.48, easing:'cubic-bezier(.2,.8,.26,1)' },
        { transform: `translateY(10px) rotateZ(-6deg) scale(0.995)`, offset:0.82, easing:'cubic-bezier(.22,.9,.3,1)' },
        { transform: 'translateY(0px) rotateZ(0deg) scale(1)', offset:1, easing:'cubic-bezier(.22,.9,.3,1)' }
      ];
      const anim = img.animate(keyframes, { duration: 1500, iterations:1, fill:'forwards' });
      return anim.finished.catch(()=>{});
    }

    function spiderCrawlAndReveal(nameEl, text, duration=1200){
      return new Promise((resolve)=>{
        nameEl.innerHTML = '';
        const chars = [];
        for(const ch of text){ const s = document.createElement('span'); s.className = 'char-pop'; s.textContent = ch; s.style.opacity = 0; s.style.display = 'inline-block'; s.style.transform = 'translateY(8px)'; nameEl.appendChild(s); chars.push(s); }

        const spiderWrap = document.createElement('div'); spiderWrap.className = 'spider'; spiderWrap.style.position = 'absolute'; spiderWrap.style.left = '-48px'; spiderWrap.style.top = '-6px'; spiderWrap.style.pointerEvents = 'none'; spiderWrap.innerHTML = `<svg class="spider-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="2.4" fill="white"></circle><path d="M12 12.8 v3 M8 11 l-3 2 M16 11 l3 2 M9 8 l-2 -3 M15 8 l2 -3"/></g></svg>`;
        const parent = nameEl.parentElement; parent.style.position = parent.style.position || 'relative'; parent.appendChild(spiderWrap);

        requestAnimationFrame(()=>{
          const parentRect = parent.getBoundingClientRect();
          const nameRect = nameEl.getBoundingClientRect();
          const charRects = chars.map(c=>c.getBoundingClientRect());
          const startX = nameRect.left - parentRect.left - 48;
          const endX = nameRect.right - parentRect.left + 12;
          const total = duration;
          const startTime = performance.now();

          function step(now){
            const t = Math.min(1, (now - startTime)/total);
            const ease = t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
            const x = startX + (endX - startX) * ease;
            spiderWrap.style.transform = `translateX(${x}px)`;
            const spiderCenter = parentRect.left + x + 12;
            for(let i=0;i<charRects.length;i++){
              const cr = charRects[i];
              const charCenter = cr.left + cr.width/2;
              if(charCenter <= spiderCenter && !chars[i].classList.contains('revealed')){
                const delayMs = Math.min(360, Math.abs(spiderCenter - charCenter) * 0.06) + i * 18;
                chars[i].style.animationDelay = `${delayMs}ms`;
                chars[i].classList.add('revealed');
              }
            }
            if(t < 1 && !prefersReducedMotion){ requestAnimationFrame(step); } else { for(const s of chars){ s.classList.add('revealed'); } setTimeout(()=>{ spiderWrap.remove(); resolve(); }, 320); }
          }
          requestAnimationFrame(step);
        });
      });
    }

    function revealBio(el, text){ el.textContent = text; el.classList.add('in'); }

    async function startSiteAnimations(){
      const avatarPromise = animateAvatarToss();
      const children = [document.querySelector('.profile-row'), document.getElementById('linksGrid')];
      let delay = 80;
      for(const ch of children){ if(!ch) continue; ch.classList.add('fall'); setTimeout(()=>ch.classList.add('in'), delay); delay += 140; }

      const nameEl = document.getElementById('nameEl');
      await spiderCrawlAndReveal(nameEl, nameText, 1200);
      revealBio(document.getElementById('bioEl'), bioText);
      document.body.classList.add('site-started');
      await avatarPromise;
    }

    /* Visibility and motion handling */
    let animateRunning = true; let lastFrame = performance.now();
    document.addEventListener('visibilitychange', () => { if(document.hidden){ animateRunning = false; } else { animateRunning = true; lastFrame = performance.now(); requestAnimationFrame(frame); } });
    if(prefersReducedMotion){ bubbles.length = 0; const splash = document.getElementById('splashScreen'); if(splash) { splash.style.display='none'; } document.body.classList.add('site-started'); document.querySelectorAll('.fall').forEach(ch=>{ ch.classList.remove('fall'); ch.classList.add('in'); }); }

    function frame(now){ if(!animateRunning) return; const dt = Math.min(0.045, (now - lastFrame)/1000); updateBubbles(dt); drawBubbles(); lastFrame = now; requestAnimationFrame(frame); }

    /* Overlay click */
    const splash = document.getElementById('splashScreen'); const video = document.getElementById('bgVideo');
    splash.addEventListener('click', async (ev) => {
      ev.stopPropagation(); try{ if(video){ video.muted = false; video.volume = 1.0; await video.play(); } }catch(err){}
      splash.classList.add('overlay-hidden'); setTimeout(()=>{ splash.style.display = 'none'; }, 520);
      try{ startSiteAnimations(); }catch(err){ console.error('startSiteAnimations error', err); }
    }, {passive:false});

    /* Pointer handlers */
    window.addEventListener('pointerdown', handlePointerDown, {passive:true});
    if(!isTouch){ window.addEventListener('mousemove', onPointerMove, {passive:true}); window.addEventListener('mouseleave', onPointerLeave, {passive:true}); }
    window.addEventListener('resize', ()=>{ resizeBubbleCanvas(); }, {passive:true});

    /* Button feedback */
    const linkButtons = Array.from(document.querySelectorAll('.link-btn'));
    linkButtons.forEach((el,i)=>{
      el.addEventListener('pointerdown', ()=> el.classList.add('active'), {passive:true});
      el.addEventListener('pointerup', ()=> el.classList.remove('active'));
      el.addEventListener('pointercancel', ()=> el.classList.remove('active'));
      el.addEventListener('pointerleave', ()=> el.classList.remove('active'));
      el.style.transitionDelay = (i*40)+'ms';
    });

    /* Errors: ensure content is visible */
    window.addEventListener('error', (ev) => {
      try{ const splash = document.getElementById('splashScreen'); if(splash) { splash.style.display='none'; } document.body.classList.add('site-started'); const toShow = document.querySelectorAll('.fall, .name, .bio, .links-grid, .profile-row'); toShow.forEach(el=>{ el.classList.remove('fall'); el.classList.add('in'); el.style.opacity = 1; el.style.transform = 'none'; }); const nameEl = document.getElementById('nameEl'); if(nameEl && nameEl.textContent.trim()==='') nameEl.textContent='AFFLY'; const bioEl = document.getElementById('bioEl'); if(bioEl && bioEl.textContent.trim()==='') bioEl.textContent='Trying to survive another boring day.....'; }catch(e){}
    });

    /* Start loops */
    resizeBubbleCanvas(); if(!prefersReducedMotion) requestAnimationFrame(frame);

    /* Accessibility: Enter to remove overlay */
    document.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !splash.classList.contains('overlay-hidden')){ splash.click(); } });

    /* Auto-enter fallback */
    setTimeout(()=>{ try{ if(splash && !splash.classList.contains('overlay-hidden')){ splash.classList.add('overlay-hidden'); setTimeout(()=>{ splash.style.display='none'; },520); try{ startSiteAnimations(); }catch(e){} document.body.classList.add('site-started'); const toShow = document.querySelectorAll('.fall, .name, .bio, .links-grid, .profile-row'); toShow.forEach(el=>{ el.classList.remove('fall'); el.classList.add('in'); el.style.opacity = 1; el.style.transform = 'none'; }); } }catch(e){} }, 900);
  </script>
</body>
</html>
