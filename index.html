<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Link in Bio — QA Panel</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
    /* Background video */
    #bgVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4}
    body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,0.28),rgba(0,0,0,0.36));z-index:-3}
    /* Canvases */
    #stormCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:-2;mix-blend-mode:screen;display:block}
    #bubbleCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:-1;display:block}
    /* Splash overlay */
    #splashScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1050;background:rgba(0,0,0,0.65);cursor:pointer;transition:opacity .5s ease}
    #splashScreen .overlay-text{color:#fff;font-family:'Courier New',monospace;font-size:22px;letter-spacing:.18em;padding:18px 28px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01))}
    #splashScreen.overlay-hidden{opacity:0;pointer-events:none}
    /* Glass panel */
    .glass-container{position:relative;z-index:10;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:24px;padding:18px;width:min(720px,92vw)}
    .glass-container::after{content:'';position:absolute;inset:-8px;border-radius:24px;pointer-events:none;box-shadow:0 0 40px 6px rgba(138,43,226,0.08);filter:blur(6px)}
    .profile-row{display:flex;align-items:center;gap:14px;justify-content:center}
    .profile-image{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0;border:2px solid rgba(255,255,255,0.08)}
    .name{color:#fff;font-size:26px;letter-spacing:0.12em;text-transform:uppercase;margin:0}
    .bio{color:rgba(255,255,255,0.92);margin:6px 0 16px}
    .links-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .link-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));color:#fff;text-decoration:none}
    /* QA panel */
    #qaPanel{position:fixed;top:12px;left:12px;z-index:2000;background:rgba(0,0,0,0.6);padding:10px;border-radius:8px;color:#fff;font-family:monospace;font-size:13px;display:flex;gap:8px;align-items:center}
    #qaPanel button{background:#222;color:#fff;border:1px solid rgba(255,255,255,0.06);padding:6px 8px;border-radius:6px;cursor:pointer}
    #qaPanel .qa-hide{display:none}
    @media(max-width:420px){.links-grid{grid-template-columns:repeat(3,1fr)}.glass-container{padding:12px}}
  </style>
</head>
<body>
  <video id="bgVideo" playsinline webkit-playsinline autoplay loop preload="auto" muted>
    <source src="Cowboy.mp4" type="video/mp4">
  </video>

  <canvas id="stormCanvas" aria-hidden="true"></canvas>
  <canvas id="bubbleCanvas" aria-hidden="true"></canvas>

  <div id="splashScreen"><div class="overlay-text">Click to enter...</div></div>

  <div class="glass-container fall" id="glassContainer">
    <div class="profile-row">
      <img src="pfp.jpg" alt="Profile" class="profile-image" id="pfp">
      <div style="position:relative;">
        <h1 class="name" id="nameEl">Afflicarious</h1>
        <p class="bio" id="bioEl">Link in bio — QA build</p>
      </div>
    </div>

    <div class="links-grid" id="linksGrid">
      <a class="link-btn magnetic" href="#">Affly Intel</a>
      <a class="link-btn magnetic" href="#">$AFFLY</a>
      <a class="link-btn magnetic" href="#">Affly Forge</a>
      <a class="link-btn magnetic" href="#">Affly Systems</a>
      <a class="link-btn magnetic" href="#">Affly Games</a>
      <a class="link-btn magnetic" href="#">Affly Media</a>
      <a class="link-btn magnetic" href="#">Affly Network</a>
      <a class="link-btn magnetic" href="#">Affly Socials</a>
    </div>
  </div>

  <!-- Audio fallback element (repo asset) -->
  <audio id="popAudio" src="assets/pop.mp3" preload="auto"></audio>

  <!-- QA Control Panel -->
  <div id="qaPanel">
    <button id="qaReveal">Reveal UI</button>
    <button id="qaMedia">Start Media</button>
    <button id="qaAnim">Start Animations</button>
    <button id="qaToggle">Hide</button>
  </div>

  <script>
    // Minimal audio helpers (compat with existing code if present)
    window.audioUnlocked = window.audioUnlocked || false;
    window.ensureAudioContext = window.ensureAudioContext || function(){ if(!window.audioCtx){ try{ window.audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ window.audioCtx = null; } } };
    window.unlockAudioOnGesture = window.unlockAudioOnGesture || function(){ if(window.audioUnlocked) return; ensureAudioContext(); if(!window.audioCtx) return; try{ const g = window.audioCtx.createGain(); g.gain.value = 0.0001; g.connect(window.audioCtx.destination); const o = window.audioCtx.createOscillator(); o.frequency.value = 0; o.connect(g); o.start(); setTimeout(()=>{ o.stop(); g.disconnect(); try{ window.audioCtx.resume && window.audioCtx.resume(); }catch(e){} }, 50); audioUnlocked = true; console.log('QA: audioUnlocked via gesture'); }catch(e){ console.warn('QA: unlockAudioOnGesture failed', e); } };
    window.playPopSound = window.playPopSound || function(){ if(window.audioUnlocked && window.audioCtx){ try{ const now = window.audioCtx.currentTime; const o = window.audioCtx.createOscillator(); const g = window.audioCtx.createGain(); o.type = 'square'; o.frequency.value = 800; g.gain.value = 0.0008; o.connect(g); g.connect(window.audioCtx.destination); o.start(now); o.stop(now + 0.04); console.log('QA: played WebAudio pop'); return; }catch(e){ console.warn('QA: WebAudio pop failed', e); } } // fallback to audio element
      const el = document.getElementById('popAudio'); if(el){ el.currentTime = 0; el.play().then(()=>console.log('QA: played <audio> pop')).catch(e=>console.warn('QA: <audio> play failed', e)); } };

    // Simple reveal function
    function revealUI(){ try{ const splash = document.getElementById('splashScreen'); if(splash) splash.classList.add('overlay-hidden'); document.body.classList.add('site-started'); Array.from(document.querySelectorAll('.fall')).forEach(el=>el.classList.add('in')); console.log('QA: Reveal UI'); try{ unlockAudioOnGesture(); }catch(e){} }catch(e){ console.error(e); } }

    function startMedia(){ try{ const v = document.getElementById('bgVideo'); if(v){ v.muted = false; v.play().then(()=>console.log('QA: bgVideo playing')).catch(e=>console.warn('QA: bgVideo play failed', e)); } try{ if(typeof unlockAudioOnGesture === 'function') unlockAudioOnGesture(); }catch(e){} try{ if(typeof playPopSound === 'function') playPopSound(); }catch(e){ console.error('QA: playPopSound error', e); } }
    catch(e){ console.error(e); } }

    function startAnimations(){ try{ // try to call existing startSiteAnimations if present
      if(typeof startSiteAnimations === 'function'){ startSiteAnimations(); console.log('QA: startSiteAnimations called'); } else { console.log('QA: startSiteAnimations not present'); } }catch(e){ console.error(e); } }

    // Wire QA panel
    document.getElementById('qaReveal').addEventListener('click', ()=>{ revealUI(); });
    document.getElementById('qaMedia').addEventListener('click', ()=>{ startMedia(); });
    document.getElementById('qaAnim').addEventListener('click', ()=>{ startAnimations(); });
    document.getElementById('qaToggle').addEventListener('click', ()=>{ const p = document.getElementById('qaPanel'); if(p.classList.contains('qa-hide')){ p.classList.remove('qa-hide'); document.getElementById('qaToggle').textContent='Hide'; } else { p.classList.add('qa-hide'); document.getElementById('qaToggle').textContent='Show'; } });

    // Make splash click do the normal entry flow
    document.getElementById('splashScreen').addEventListener('click', ()=>{ revealUI(); startMedia(); startAnimations(); });

    console.log('QA panel initialized — branch: copilot/qa-panel');
  </script>
</body>
</html>
